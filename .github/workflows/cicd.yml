name: CI/CD Pipeline

on:
  push:
    branches:
      - d
    tags:
      - '[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/stsaria/P4PCore.git@d
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest
  
  build-package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build "Nuitka[onefile]"
          P4PCORE_REF=main
          case "${GITHUB_REF_NAME}" in
            *a*|*b*|*rc*) P4PCORE_REF=d ;;
          esac
          pip install "git+https://github.com/stsaria/P4PCore.git@${P4PCORE_REF}"
          pip install .

      - name: Build Python package
        run: |
          python -m build

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  build-binary:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            filename: P4PSignaling-linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
            filename: P4PSignaling-windows-x86_64.exe
          - os: macos-latest
            artifact: macos-arm64
            filename: P4PSignaling-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install C Compiler (macOS Only)
        if: runner.os == 'macOS'
        run: xcode-select --install || true

      - name: Set up MSVC (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tool and dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "Nuitka[onefile]"
          P4PCORE_REF=main
          case "${GITHUB_REF_NAME}" in
            *a*|*b*|*rc*) P4PCORE_REF=d ;;
          esac
          pip install "git+https://github.com/stsaria/P4PCore.git@${P4PCORE_REF}"
          pip install .

      - name: Build single-file binary
        shell: bash
        run: >-
          python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --output-dir=dist
          --output-filename="${{ matrix.filename }}"
          --remove-output
          --include-package=P4PSignaling
          --include-distribution-metadata=P4PSignaling
          src/launcher.py

      - name: Upload single-file binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artifact }}
          path: dist/${{ matrix.filename }}

  build-container:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stsaria/p4psignaling
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}

      - name: Select P4PCore ref
        id: p4pcore
        shell: bash
        run: |
          P4PCORE_REF=main
          case "${GITHUB_REF_NAME}" in
            *a*|*b*|*rc*) P4PCORE_REF=d ;;
          esac
          echo "ref=${P4PCORE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            P4PCORE_REF=${{ steps.p4pcore.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  release:
    needs:
      - build-package
      - build-binary
      - build-container
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*